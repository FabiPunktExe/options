product:
  type: kmp/lib
  platforms: [ jvm, mingwX64, linuxX64, linuxArm64, macosArm64 ]

repositories:
  - id: diruptioPublic
    url: https://repo.diruptio.de/repository/maven-public-releases
    resolve: false
    publish: true
    credentials:
      file: //local.properties
      usernameKey: diruptio_repo_username
      passwordKey: diruptio_repo_password

settings:
  publishing:
    enabled: true
    group: de.fabiexe
    artifactId: options
    version: 1.1.0